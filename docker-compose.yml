version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalh-site
    restart: always
    expose:
      - "3000"
    volumes:
      - ./database:/app/database
    environment:
      - NODE_ENV=production
      - PAYLOAD_SECRET=digitalh-super-secret-2026-xK9mR4pQ

  caddy:
    image: caddy:2-alpine
    container_name: digitalh-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
